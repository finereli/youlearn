<!doctype html><meta charset="utf-8">
<style>
  /* One 16:9 frame that reads on a phone held upright too: YouTube crops the
     thumbnail to the screen's shape, so upright only the middle ~27% of the
     width shows. Everything sits in that column, clear of YouTube's title (top),
     play button (middle) and "Watch on YouTube" bar (bottom). */
  html, body { margin: 0; width: 1920px; height: 1080px; background: #0f2e2c; overflow: hidden; }
  body { font-family: 'Inter', 'DejaVu Sans', system-ui, sans-serif; color: #f4e9d0; }
  .col { position: absolute; left: 50%; width: 500px; margin-left: -250px; text-align: center; }
  .top { top: 150px; display: grid; justify-items: center; gap: 18px; }
  .bottom { top: 650px; display: grid; justify-items: center; gap: 14px; }
  .check { width: 120px; height: 120px; border-radius: 50%; background: #6fcf97; color: #0f2e2c; font-size: 92px; line-height: 120px; font-weight: 900; }
  h1 { margin: 0; font-size: 118px; line-height: 1; font-weight: 800; color: #e5b84b; letter-spacing: -2px; white-space: nowrap; }
  p { margin: 0; font-size: 68px; line-height: 1.05; font-weight: 700; white-space: nowrap; }
  .app { display: flex; align-items: center; gap: 18px; color: #e5b84b; }
  .app img { width: 86px; height: 86px; border-radius: 20px; }
  .ring { position: absolute; left: 50%; top: 540px; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%; background: radial-gradient(circle, rgba(229,184,75,0.16), rgba(229,184,75,0) 70%); }
</style>
<div class="ring"></div>
<div class="col top"><div class="check">✓</div><h1>All set!</h1></div>
<div class="col bottom"><p>Go back to</p><p class="app"><img src="logo.png" alt="">YouLearn</p></div>
